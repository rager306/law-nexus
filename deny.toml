# cargo-deny v2 baseline for law-nexus (vmi2929903 Rust Standard)
[graph]
targets = ["x86_64-unknown-linux-gnu"]
all-features = false
no-default-features = false

[advisories]
version = 2
yanked = "warn"
# Scope settings (v2): check unsound across the full graph (including dev deps);
# pass `-D unsound` to `cargo deny check` so unsound advisories fail the gate.
unsound = "all"
unmaintained = "workspace"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.8
unused-allowed-license = "allow"
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    "0BSD",
    "CDLA-Permissive-2.0",
    "OpenSSL",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
