# Repository quality gate for the Rust product runtime and Python harness.
# Rust runs in a separate job through the ADR-0007 process-only harness boundary.
# Python product code is archived prior art; active Python checks cover the
# repository-control harness only. This workflow has no dependency on archived
# architecture tooling or generated semantic projections.

name: repository-quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: repository-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-harness-quality:
    name: Python harness and repository architecture checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff lint active Python harness
        run: uv run ruff check src/

      - name: Ruff format active Python harness
        run: uv run ruff format --check src/

      - name: Basedpyright active Python harness
        run: uv run basedpyright src/

      - name: Ty active Python harness
        run: uv run ty check src/

      - name: Pyrefly active Python harness
        run: uv run pyrefly check src/

      - name: Workspace crate dependency allowlist
        run: uv run python scripts/verify-crate-dependency-allowlist.py

      - name: Architecture lifecycle tags and ADR references
        run: uv run python scripts/verify-adr-conformance.py

  rust-harness-quality:
    name: Rust workspace and process harness checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.13

      - name: Install Python harness dependencies
        run: uv sync --frozen

      - name: Rust formatting
        run: cargo fmt --all -- --check

      - name: Rust offline check
        run: cargo check --workspace --offline

      - name: Rust clippy
        run: cargo clippy --workspace --offline --all-targets -- -D warnings

      - name: Build Rust harness binaries
        run: cargo build --workspace --offline

      - name: Rust tests
        run: cargo test --workspace --offline

      - name: Process-only harness tests
        run: >-
          uv run pytest -q
          tests/test_harness_status_tracer.py
          tests/test_harness_subprocess_failure_modes.py
          tests/test_harness_no_forbidden_imports.py
          tests/test_harness_governor.py
          tests/test_harness_cli_entrypoints.py
          tests/test_harness_preflight.py
          tests/test_repository_quality_gate.py
          tests/test_verify_crate_dependency_allowlist.py
          tests/test_verify_port_contract_coverage.py
          tests/test_verify_hostile_negative_suite_coverage.py
          tests/test_verify_multi_adapter_port_coverage.py
          tests/test_verify_live_adapter_readiness.py

      - name: Process inventory scripts (report-only)
        run: >-
          uv run python scripts/verify-port-contract-coverage.py
          && uv run python scripts/verify-hostile-negative-suite-coverage.py
          && uv run python scripts/verify-multi-adapter-port-coverage.py
          && uv run python scripts/verify-live-adapter-readiness.py
