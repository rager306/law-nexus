# Repository quality gate for the Rust product runtime and Python harness.
# Rust runs in a separate job through the ADR-0007 process-only harness boundary.
# Python product code is archived prior art; active Python checks cover the
# repository-control harness only. This workflow has no dependency on archived
# architecture tooling or generated semantic projections.

name: repository-quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: repository-quality-${{ github.ref }}
  cancel-in-progress: true

# All runs stay inside the checkout: TMPDIR points shell/Python/Rust temp
# files at the gitignored tmp/ tree instead of the machine-wide /tmp.
# The directory is created explicitly: fresh clones have no tmp/ tree.
env:
  TMPDIR: ${{ github.workspace }}/tmp/scripts

jobs:
  python-harness-quality:
    name: Python harness and repository architecture checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Create repo-local temp tree
        run: mkdir -p "${{ github.workspace }}/tmp/scripts" "${{ github.workspace }}/tmp/pytest"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff lint active Python harness
        run: uv run ruff check src/

      - name: Ruff format active Python harness
        run: uv run ruff format --check src/

      - name: Basedpyright active Python harness
        run: uv run basedpyright src/

      - name: Ty active Python harness
        run: uv run ty check src/

      - name: Pyrefly active Python harness
        run: uv run pyrefly check src/

      - name: Workspace crate dependency allowlist
        run: uv run python scripts/verify-crate-dependency-allowlist.py

      - name: Architecture lifecycle tags and ADR references
        run: uv run python scripts/verify-adr-conformance.py

  rust-harness-quality:
    name: Rust workspace and process harness checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Create repo-local temp tree
        run: mkdir -p "${{ github.workspace }}/tmp/scripts" "${{ github.workspace }}/tmp/pytest"

      - name: Install Rust toolchain (pinned by rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.13

      - name: Install Python harness dependencies
        run: uv sync --frozen

      - name: Restore pinned GSD Path runtime (vendored archive, digest-verified)
        run: |
          set -euo pipefail
          if [ ! -f .ai/vendor/gsd-path-1.6.2.tgz ]; then
            echo "error: pinned GSD Path runtime archive is missing: .ai/vendor/gsd-path-1.6.2.tgz" >&2
            echo "recorded pinned runtime: $(cat .gsd-path/runtime.json)" >&2
            exit 1
          fi
          restore_dir="$(mktemp -d)"
          trap 'rm -rf "$restore_dir"' EXIT
          tar -xzf .ai/vendor/gsd-path-1.6.2.tgz -C "$restore_dir"
          python3 "$restore_dir/gsd-path/scripts/install.py" \
            --runtime-restore \
            --project "$GITHUB_WORKSPACE" \
            --source-root "$restore_dir/gsd-path"

      - name: Fetch locked Rust dependencies
        run: cargo fetch --locked

      - name: Rust formatting
        run: cargo fmt --all -- --check

      - name: Rust offline check
        run: cargo check --workspace --offline

      - name: Rust clippy
        run: cargo clippy --workspace --offline --all-targets -- -D warnings

      - name: Build Rust harness binaries
        run: cargo build --workspace --offline

      - name: Rust tests
        run: cargo test --workspace --offline
        env:
          TMPDIR: ${{ github.workspace }}/tmp/scripts
          CARGO_TARGET_DIR: ${{ github.workspace }}/target

      - name: Product and architecture harness tests
        run: >-
          uv run pytest -q -rs
          tests/test_harness_subprocess_failure_modes.py
          tests/test_harness_status_tracer.py
          tests/test_harness_governor.py
          tests/test_harness_preflight.py
          tests/test_harness_review_case_cli.py
          tests/test_review_case_governor.py
          tests/test_review_case_schema.py
          tests/test_review_case_delta_fixture.py
          tests/test_verify_crate_dependency_allowlist.py
          tests/test_verify_port_contract_coverage.py
          tests/test_verify_hostile_negative_suite_coverage.py
          tests/test_verify_multi_adapter_port_coverage.py
          tests/test_verify_live_adapter_readiness.py
          tests/test_architecture_views.py
          tests/test_architecture_analysis_views.py
          tests/test_architecture_remediation_matrix.py
          tests/test_architecture_track_split.py
          tests/test_architecture_closure_roadmap.py
          tests/test_architecture_registry_schema.py
          tests/test_verify_adr_conformance.py

      - name: Process inventory scripts (report-only)
        run: >-
          uv run python scripts/verify-port-contract-coverage.py
          && uv run python scripts/verify-hostile-negative-suite-coverage.py
          && uv run python scripts/verify-multi-adapter-port-coverage.py
          && uv run python scripts/verify-live-adapter-readiness.py

  migration-layer-quality:
    # The migration's own tests must never sit behind a product gate that is
    # red for pre-existing debt: the default branch's Rust tests have failed
    # since 2026-08-22, which silently skipped every harness check below them.
    # This job depends on nothing but checkout + uv, so a red product job and a
    # red migration job are two separate, visible signals.
    name: Migration layer (workflow state, dispatch, source snapshot, hooks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
        with:
          # The shipped-main governor proof reads the integration landing from
          # origin/main first-parent history; a shallow clone cannot verify it.
          fetch-depth: 0

      - name: Create repo-local temp tree
        run: mkdir -p "${{ github.workspace }}/tmp/scripts" "${{ github.workspace }}/tmp/pytest"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.13

      - name: Install Python harness dependencies
        run: uv sync --frozen

      - name: Restore pinned GSD Path runtime (vendored archive, digest-verified)
        run: |
          set -euo pipefail
          if [ ! -f .ai/vendor/gsd-path-1.6.2.tgz ]; then
            echo "error: pinned GSD Path runtime archive is missing: .ai/vendor/gsd-path-1.6.2.tgz" >&2
            echo "recorded pinned runtime: $(cat .gsd-path/runtime.json)" >&2
            exit 1
          fi
          restore_dir="$(mktemp -d)"
          trap 'rm -rf "$restore_dir"' EXIT
          tar -xzf .ai/vendor/gsd-path-1.6.2.tgz -C "$restore_dir"
          python3 "$restore_dir/gsd-path/scripts/install.py" \
            --runtime-restore \
            --project "$GITHUB_WORKSPACE" \
            --source-root "$restore_dir/gsd-path"

      - name: Prepare shipped-main integration proof inputs
        run: |
          set -euo pipefail
          # The pinned runtime proves the integration landing against the
          # published default branch; the checkout must name it origin/HEAD.
          git symbolic-ref refs/remotes/origin/HEAD refs/remotes/origin/main

      - name: Migration-layer tests
        run: >-
          uv run pytest -q -rs
          tests/test_harness_workflow_state.py
          tests/test_phase_dispatch_adapter.py
          tests/test_verify_source_snapshot_v2.py
          tests/test_harness_cli_entrypoints.py
          tests/test_harness_no_forbidden_imports.py
          tests/test_documentation_navigation.py
          tests/test_repository_quality_gate.py
          tests/test_ci_runtime_restore.py

      - name: Pre-commit hook guard chain
        run: uv run pytest -q -rs tests/test_verify_repository_pre_commit_hook.py

      - name: Harness status and preflight contracts
        run: >-
          uv run pytest -q -rs
          tests/test_harness_preflight.py
          tests/test_harness_governor.py

      - name: Governor report is honest about bootstrap mode
        run: |
          set -o pipefail
          uv run python -m law_nexus_harness.governor | tee governor.json
          uv run python - <<'PY'
          import json, os, sys

          report = json.load(open("governor.json"))
          print("governor:", report["status"], "pass", report["pass_count"],
                "warn", report["warn_count"], "errors", report["tool_error_count"])
          if report["tool_error_count"]:
              sys.exit("governor reported tool errors: a check could not read its inputs")
          if os.environ.get("GITHUB_REF") == "refs/heads/main":
              observed = " ".join(
                  finding.get("observed", "")
                  for finding in report["findings"]
                  if finding.get("check_id") == "workflow-state-surface"
              )
              for fact in ("kind=shipped-integrated;",
                           ".project/archive/001-001-native-workflow-acceptance"):
                  if fact not in observed:
                      sys.exit(
                          "governor on main must report the shipped integrated state; "
                          f"workflow-state-surface observed: {observed!r} (missing {fact!r})"
                      )
          PY

      - name: Publish governor diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: governor-diagnostics
          path: governor.json
          if-no-files-found: error

  corpus-integration:
    # The portable Rust job skips corpus-dependent tests when the gitignored
    # corpus is absent, which is what makes a cold clone runnable. This job is
    # the opposite claim: LAW_NEXUS_REQUIRE_CORPUS=1 turns every such skip into a
    # hard failure, so "corpus absent" can never be reported as "corpus green".
    #
    # Actual setup: the job targets the GitHub-hosted ubuntu-latest label, where
    # the gitignored corpus is absent, so it stays skipped unless the repository
    # variable LAW_NEXUS_CORPUS_AVAILABLE is set to 1 — and setting it for a
    # hosted runner would fail the strict environment hard instead of proving
    # anything. Nothing in this workflow sets a LAW_NEXUS_CORPUS_AVAILABLE value.
    # Any future strict target is a restricted self-hosted runner label (corpus
    # exposure ruling 2026-10-26: runner-only); until such a runner exists, the
    # strict corpus claim stays documented as impossible, not green.
    name: Corpus integration (strict, only where the corpus is present)
    runs-on: ubuntu-latest
    if: vars.LAW_NEXUS_CORPUS_AVAILABLE == '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Create repo-local temp tree
        run: mkdir -p "${{ github.workspace }}/tmp/scripts" "${{ github.workspace }}/tmp/pytest"

      - name: Install Rust toolchain (pinned by rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy

      - name: Fetch locked Rust dependencies
        run: cargo fetch --locked

      - name: Corpus-dependent contract tests must actually run
        env:
          LAW_NEXUS_REQUIRE_CORPUS: "1"
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          cargo test -p ln-consultant-parser --offline \
            --test gold_ladder_contract --test temporal_provenance_vertical

      - name: Record that the corpus was really exercised
        run: |
          echo "Corpus integration ran with LAW_NEXUS_REQUIRE_CORPUS=1."
          echo "A missing or mis-set CONSULTANT_EXPORT_DIR would have FAILED, not skipped."

  offline-contract-verifiers:
    name: Milestone offline contract chains (M207/S03, M207/S04, M208/S04)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Create repo-local temp tree
        run: mkdir -p "${{ github.workspace }}/tmp/scripts" "${{ github.workspace }}/tmp/pytest"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.13

      - name: Install Python harness dependencies
        run: uv sync --frozen

      - name: Set up Node
        uses: actions/setup-node@v4.0.0
        with:
          node-version: 22

      # M207/S04 + S03: REPORT-ONLY in CI, by contract, not by convenience.
      #
      # These are frozen corpus batteries. Three of their inputs cannot exist on
      # a CI runner and never will:
      #   - consru_export/ (43 785 XML) is gitignored  -> CORPUS_COUNT_DRIFT
      #   - prd/.../m207-s04-c4-attempts/** logs are gitignored -> ATTEMPT_LOG_MISSING
      #   - quick-xml is not vendored for --offline -> cargo exit 101
      # MIGRATION.md section 5 names exactly those three and states the rule:
      # "Не запускать каждый frozen corpus battery как универсальный cold-clone
      # check." A battery that cannot read its inputs proves nothing about a
      # clone, so gating on it measures the runner, not the repository.
      #
      # The portable parts of these batteries are NOT lost: schema validation,
      # ruff, adr-conformance and the fragment-count pin all still run below and
      # their exit codes are asserted. Only the corpus-bound verdict is advisory,
      # and the schema check keeps exactly two documented advisory signatures
      # (CORPUS_COUNT_DRIFT, S03_RATE_IMPORTED); any other finding fails the job.
      #
      # Separately, the frozen token scan (S03_RATE_IMPORTED / PROMPT_ISOLATION_
      # VIOLATION) reports a conflict between two frozen proof contracts: the
      # ban forbids "m207-s04"/"prd/annotation" anywhere under crates/, while the
      # product code carries those paths as absence witnesses
      # (amendment_provenance.rs:3086-3120 asserts the pilot was NOT run;
      # npa_wire.rs:4 cites the wire contract it implements). The scanners are a
      # bare `if pattern in text` and cannot tell the two apart. The ban
      # (2026-09-16) predates the witness (2026-09-23), and moving either means
      # amending a frozen contract: an ADR call (D466/D487), not a migration
      # edit. Evidence and the owner action are in MIGRATION-RECORD.
      - name: M207 S04 frozen corpus battery (report-only, needs gitignored corpus and logs)
        continue-on-error: true
        run: bash scripts/m207_s04_t04_verify.sh

      - name: M207 S04 portable parts must still pass
        run: |
          # The schema check is a blocking gate: its exit code is asserted and
          # its output stays visible. Exactly two known documented conflicts
          # stay advisory (the E9 boundary: the gitignored corpus and the
          # frozen-token D466/D487 record):
          #   FAIL CORPUS_COUNT_DRIFT: ...  the gitignored corpus is absent
          #   FAIL S03_RATE_IMPORTED: ...   frozen-token conflict (D466/D487)
          # Any other finding, or a failure whose output is not fully accounted
          # for by those two signatures, fails this step. No shell-truth
          # fallback and no new suppression is introduced here.
          set -e
          schema_log="$TMPDIR/m207-s04-schema-check.log"
          set +e
          uv run --frozen python scripts/m207_s04_schemas.py check 2>&1 | tee "$schema_log"
          schema_code=${PIPESTATUS[0]}
          set -e
          if [ "$schema_code" -ne 0 ]; then
            known='^(FAIL (CORPUS_COUNT_DRIFT|S03_RATE_IMPORTED): |FAIL M207_S04_SCHEMAS_GATE: )'
            if [ ! -s "$schema_log" ] \
              || ! grep -Eq '^FAIL (CORPUS_COUNT_DRIFT|S03_RATE_IMPORTED): ' "$schema_log" \
              || grep -Ev "$known" "$schema_log" | grep -q .; then
              echo "m207 schema check: exit $schema_code is not fully accounted for by the known advisory signatures CORPUS_COUNT_DRIFT / S03_RATE_IMPORTED" >&2
              exit 1
            fi
            echo "m207 schema check: exit $schema_code carries only the two known documented conflicts; advisory" >&2
          fi
          # The rest of the portable parts do not need the corpus, the pinned
          # logs or an offline crate.
          uv run ruff format --check scripts/m207_s04_schemas.py scripts/m207_s04_c4_run.py scripts/m207_s04_pilot.py scripts/test_m207_s04_pilot.py
          uv run ruff check scripts/m207_s04_schemas.py scripts/m207_s04_c4_run.py scripts/m207_s04_pilot.py scripts/test_m207_s04_pilot.py
          uv run python scripts/verify-adr-conformance.py

      # The S03 chain exits 3 when the human pilot is absent (D495 boundary:
      # MACHINERY_GREEN_HUMAN_ABSENT); 0 and 3 are the documented green boundary.
      # Its corpus-bound verdict is report-only for the same reasons as above.
      - name: M207 S03 frozen evaluation chain (report-only, documented exit 0/3)
        continue-on-error: true
        run: |
          set +e
          bash scripts/m207_s03_t06_verify.sh
          code=$?
          set -e
          echo "M207 S03 chain exited $code (documented green boundary is 0 or 3)"

      # M208/S04 admission contract (node --test scripts/m208_s04_admission_contract.test.mjs)
      # stays wired-out: its admission record pins ADR-0028 bytes, which legitimately
      # evolved via the D512-sanctioned M205/S04 companion (commit 1c01c09). Refreshing
      # that pin is part of the pending M208 owner scope decision, not a CI edit.
