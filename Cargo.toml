[workspace]
members = ["crates/ln-status", "crates/ln-observe", "crates/ln-hc01-runner", "crates/ln-inventory", "crates/ln-hc02-runner", "crates/ln-dispose", "crates/ln-hc03-runner", "crates/ln-promote", "crates/ln-hc04-runner", "crates/ln-decode", "crates/ln-product-cli", "crates/ln-storage", "crates/ln-hc05-runner", "crates/ln-gate", "crates/ln-hc06-runner", "crates/ln-identity", "crates/ln-hc07-runner", "crates/ln-relation", "crates/ln-hc08-runner", "crates/ln-temporal", "crates/ln-hc09-runner", "crates/ln-work", "crates/ln-hc10-runner", "crates/ln-closure", "crates/ln-hc11-runner", "crates/ln-projection", "crates/ln-hc12-runner", "crates/ln-admission", "crates/ln-hc13-runner", "crates/ln-replay", "crates/ln-hc14-runner", "crates/ln-publish", "crates/ln-hc15-runner", "crates/ln-accelerate", "crates/ln-query", "crates/ln-citation", "crates/ln-diagnostic", "crates/ln-conformance", "crates/ln-hc16-runner", "crates/ln-hc17-runner", "crates/ln-hc18-runner", "crates/ln-hc19-runner", "crates/ln-hc20-runner", "crates/ln-applicability", "crates/ln-kb-ontology", "crates/ln-testkit", "crates/ln-consultant-parser"]
resolver = "3"

# Profile tuning synced with kache + mold (2026-10-10):
# - non-workspace deps without DWARF: shared dependency debuginfo contributes
#   to target/ size across 47 workspace crates (including 20 hc-runners).
#   The package."*" override does not apply to workspace members.
# - incremental = false for deps is a no-op under kache (it strips the
#   incremental dir anyway) but states intent.
[profile.dev]
# Measured in THIS workspace: target/debug/incremental held 1.7 GB for 513
# workspace-member test targets, more than deps/ (1.2 GB), and it is cargo's
# directory, not the compiler cache's. Every integration target keeps its own
# incremental state and the repo has many. Off for the workspace profile; a
# single-crate loop opts back in with CARGO_INCREMENTAL=1 (measured cost of
# leaving it off: 2.4 s to rebuild ln-status).
incremental = false
# The size comes from stripping the symbol table, not from `debug`. Measured on
# one test binary, four combinations: strip=debuginfo is 1.2 MB at either debug
# level, unstripped is 7.0 MB at either level - so `debug` moves the size by
# nothing. Dropping `line-tables-only` additionally costs backtrace file:line
# for 200 bytes, which is a bad trade, so the level stays.
debug = "line-tables-only"
# Panic messages and `panicked at file:line` survive (they are string literals);
# backtrace frames do not. Recover them for one run with
# CARGO_PROFILE_DEV_STRIP=false, which is enough because the level above is
# kept - or build the `debugging` profile below, which is a distinct fingerprint
# so it does not thrash the dev artifacts.
strip = "debuginfo"

[profile.dev.package."*"]
debug = false
incremental = false

# `cargo test --profile debugging` for triage that needs backtrace frames.
# Declared rather than pushed through CARGO_PROFILE_* env vars so the two
# variants keep separate fingerprints and do not rebuild each other.
[profile.debugging]
inherits = "dev"
strip = false

[profile.release]
lto = "thin"
strip = true
