      ReclassifyEntry:
        target_selector: "table entry whose classification changes"
        expected_base_version: "table content version the instrument expects"
        precondition: "the entry resolves and the new classification is declared at the expected base"
        payload: "new classification"
        effect_selector: "selector carried into the authorized Text effect (one of effect_selector_modes)"
        scope: "classification of one entry; content otherwise unchanged"
        postcondition: "entry reclassified in the table's next content version"
        evidence_span: "span of the instrument wording that authorizes the reclassification"
        typed_failures: [TargetNotFound, AmbiguousTarget, PreconditionMismatch, BaseVersionMismatch, UnsupportedOperation, IncompleteSource]
        runtime_today: none
        notes: "not implemented; name reserved (LegalList axis deferred)."
