        effect_selector: "selector carried into the authorized Text/Membership effect (one of effect_selector_modes)"
        scope: "one entry of one table or list"
        postcondition: "entry present in the table's next content version"
        evidence_span: "span of the instrument wording that authorizes the insertion"
        typed_failures: [TargetNotFound, AmbiguousTarget, PreconditionMismatch, BaseVersionMismatch, OrderingConflict, UnsupportedOperation, IncompleteSource]
        runtime_today: none
        notes: "not implemented; name reserved (LegalList axis deferred)."
      DeleteEntry:
        target_selector: "table or list component plus entry selector"
        expected_base_version: "table content version the instrument expects"
        precondition: "the entry resolves unambiguously at the expected base"
        payload: "entry selector being removed"
        effect_selector: "selector carried into the authorized Text/Membership effect (one of effect_selector_modes)"
        scope: "one entry of one table or list"
        postcondition: "entry absent from the table's next content version"
        evidence_span: "span of the instrument wording that authorizes the deletion"
        typed_failures: [TargetNotFound, AmbiguousTarget, PreconditionMismatch, BaseVersionMismatch, OrderingConflict, UnsupportedOperation, IncompleteSource]
        runtime_today: none
        notes: "not implemented; name reserved (LegalList axis deferred)."
      SplitEntry:
        target_selector: "table entry plus split boundaries"
        expected_base_version: "table content version the instrument expects"
        precondition: "the entry resolves and the split boundaries are declared at the expected base"
        payload: "boundaries and designations of the resulting entries"
        effect_selector: "selector carried into the authorized Text/Membership effect (one of effect_selector_modes)"
        scope: "one entry of one table or list"
        postcondition: "several entries with recorded continuity"
        evidence_span: "span of the instrument wording that authorizes the split"
        typed_failures: [TargetNotFound, AmbiguousTarget, PreconditionMismatch, BaseVersionMismatch, OrderingConflict, UnsupportedOperation, IncompleteSource]
        runtime_today: none
        notes: "not implemented; name reserved (LegalList axis deferred)."
      MergeEntries:
        target_selector: "table entries to merge"
        expected_base_version: "table content version the instrument expects"
        precondition: "all entries resolve at the expected base and the merge rule is declared"
