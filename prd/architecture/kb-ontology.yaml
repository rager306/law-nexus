# Knowledge-base ontology + meta-prompt FSM (source of truth)
#
# Lifecycle: [proposed]
# Non-authority: not production graph schema, not Applicable, not legal
# correctness, not RuVector validation, not ontology conformance.
# Rust/Python load this file; they must not invent kinds, levels, or
# transitions that are absent here.

schema_version: law-nexus-kb-ontology/v1
lifecycle: "[proposed]"
authoritative: false
boundary: >
  Meta-prompt FSM and L1-L3 vocabulary only. Not production graph schema,
  not legal correctness, not applicability.

fsm:
  name: kb-ontology-readiness
  initial: O0
  current: O2_calendar_ordinal
  terminal:
    - O6_closed_bounded
    - O6_closed_validated
  states:
    O0:
      name: inventory_open
      meaning: surfaces named; no projection contract
      exit: draft kinds, forbidden list, and this FSM exist
    O1:
      name: draft_l1_l3_projection
      meaning: node/edge inventory + non-claims
      exit: Governor structural coverage + forbidden kinds
    O2:
      name: identity_ctv_force_join_offline
      meaning: Work/Expression, force, membership join offline
      exit: join + FRBR mint + non-claims
    O2_writeset:
      name: pure_write_set
      meaning: domain to typed graph ops, no I/O
      exit: project_* functions + forbidden reject
    O2_fold:
      name: membership_fold
      meaning: StructuralAst is a fold projection at t
      exit: fold_membership_at + MembershipConflict
    O2_expression_presence:
      name: expression_presence
      meaning: CC include/exclude in one Expression
      exit: later Expression does not inherit
    O2_decode_lift:
      name: decode_lift_fail_closed
      meaning: HierarchyMarker maps to CC only via registry
      exit: unmapped is Unknown; number+level is not a CC
    O2_catalog_kinds:
      name: catalog_validated_kinds
      meaning: node/edge/presence tokens come from YAML, not Rust enums
      exit: unknown kind fails closed; Manifestation is catalog-legal
    O2_catalog_coverage:
      name: closed_vocab_coverage
      meaning: closed Rust enums are subsets of YAML vocabularies
      exit: Governor coverage table; no invented tokens
    O2_composition_lift:
      name: composition_decode_lift
      meaning: product-cli lifts HierarchyNode through YAML aliases; empty registry is Unknown
      exit: inspect reports lifts_unknown; no CC mint
    O2_decode_prefixes:
      name: yaml_decode_prefixes
      meaning: marker prefixes and number styles live in YAML, not Rust tables
      exit: extract_hierarchy reads catalog; inspect marker count unchanged
    O2_calendar_ordinal:
      name: calendar_iso_to_ordinal
      meaning: ISO legal_act_effect_day maps to synthetic ordinal; not a legal calendar
      exit: invalid civil day fail-closed; Feb 30 rejected
    O3:
      name: representative_fixture_edges
      meaning: bounded fixtures, not corpus gold
      exit: KBO-R013 partial fixtures
    O4:
      name: port_materialization_bounded
      meaning: write-set through graph-store port
      exit: InMemory adapter, still not live RuVector proof
    O5:
      name: human_scope_acceptance
      meaning: human gate on legal/semantic scope
      exit: recorded acceptance
    O6_closed_bounded:
      name: closed_bounded
      meaning: class-matched bounded close
      exit: TSG disposition rules
    O6_closed_validated:
      name: closed_validated
      meaning: corpus-backed close
      exit: representative corpus + non-claims
  transitions:
    - {from: O0, to: O1, when: draft_surfaces_present}
    - {from: O1, to: O2, when: identity_and_force_join_offline}
    - {from: O2, to: O2_writeset, when: write_set_pure_no_io}
    - {from: O2_writeset, to: O2_fold, when: membership_fold_projection}
    - {from: O2_fold, to: O2_expression_presence, when: cc_presence_per_expression}
    - {from: O2_expression_presence, to: O2_decode_lift, when: hierarchy_marker_map_fail_closed}
    - {from: O2_decode_lift, to: O2_catalog_kinds, when: kinds_are_catalog_tokens}
    - {from: O2_catalog_kinds, to: O2_catalog_coverage, when: closed_enums_covered_by_yaml}
    - {from: O2_catalog_coverage, to: O2_composition_lift, when: composition_lifts_decode_nodes}
    - {from: O2_composition_lift, to: O2_decode_prefixes, when: prefixes_are_yaml_data}
    - {from: O2_decode_prefixes, to: O2_calendar_ordinal, when: iso_day_maps_to_ordinal}
    - {from: O2_calendar_ordinal, to: O3, when: representative_fixtures}
    - {from: O3, to: O4, when: port_write_no_live_claim}
    - {from: O4, to: O5, when: human_scope}
    - {from: O5, to: O6_closed_bounded, when: bounded_disposition}
    - {from: O5, to: O6_closed_validated, when: corpus_disposition}
  forbidden_jumps:
    - {from: O2_decode_lift, to: O6_closed_validated, why: no skip of fixtures and human gate}
    - {from: O2_catalog_kinds, to: O6_closed_validated, why: no skip of fixtures and human gate}
    - {from: O2_catalog_coverage, to: O6_closed_validated, why: no skip of fixtures and human gate}
    - {from: O2_composition_lift, to: O6_closed_validated, why: no skip of fixtures and human gate}
    - {from: O2_decode_prefixes, to: O6_closed_validated, why: no skip of fixtures and human gate}
    - {from: O2_calendar_ordinal, to: O6_closed_validated, why: no skip of fixtures and human gate}
    - {from: O1, to: O4, why: no store I/O before offline join and fold}
  guards:
    - id: kernel_owns_substance
      rule: external standards are compatibility only
    - id: unmapped_marker_is_unknown
      rule: HierarchyMarker without registry binding is Unknown
    - id: number_plus_level_is_not_cc
      rule: marker number and level never mint ComponentConcept
    - id: later_expression_does_not_inherit
      rule: presence log is per ExpressionId
    - id: membership_is_not_in_force
      rule: tree presence does not write ForceStatus InForce
    - id: in_force_is_not_applicable
      rule: force edges must not write ApplicableDecision
    - id: parsed_as_is_not_force
      rule: Work→DocumentGroupRef parsed_as binding never writes ForceStatusEvent or ApplicableDecision
    - id: profile_is_not_authority
      rule: document group profile is a system_observation heuristic, never legal authority
    - id: no_sixth_clock
      rule: profile or budget cycle is not a clock
    - id: calendar_is_not_legal_effect
      rule: ISO-to-ordinal is civil-day arithmetic, not CTV text or InForce

vocabulary:
  join_keys:
    - ComponentConceptId
    - AmendingActId
    - effect_day
    - work_id
    - expression_id
  hierarchy_levels:
    - razdel
    - glava
    - paragraph
    - statya
    - chast
    - punkt
    - podpunkt
  node_kinds:
    - Work
    - Expression
    - Manifestation
    - ComponentConcept
    - AmendingAct
    - MembershipEdge
    - StructuralIndustrialEvent
    - ForceStatusEvent
    - DocumentGroupRef
  edge_kinds:
    - expression_of
    - manifestation_of
    - component_in_expression
    - membership_parent
    - industrial_op_subject
    - industrial_op_target
    - force_status_of
    - prov_amending_act
    - parsed_as
  forbidden_node_kinds:
    - ApplicableDecision
    - PracticeRulingAsForce
    - RiskScoreAsStatus
    - ProfileCodeAsClock
    - NormRuleAsAuthority
    - NormativeBlob
    - DocumentProfileAsAuthority
    - ProfileBindingAsForce
    - DocumentProfileAsClock
  presence_change_kinds:
    - include
    - exclude
  presence_fold_ops:
    include: add
    exclude: remove
  membership_change_kinds:
    - attach
    - detach
  industrial_op_kinds:
    - renumber
    - move
    - split
    - merge
  force_status_values:
    - in_force
    - suspended
    - repealed
    - superseded
    - transitional
    - unknown
  decode_level_aliases:
    Razdel: razdel
    Glava: glava
    Paragraph: paragraph
    Statya: statya
    Chast: chast
    Punkt: punkt
    Podpunkt: podpunkt
  decode_marker_prefixes:
    Razdel: [Раздел, РАЗДЕЛ, раздел]
    Glava: [Глава, ГЛАВА, глава]
    Statya: [Статья, СТАТЬЯ, статья]
    Paragraph: ["§"]
  decode_numbered_markers:
    Chast: {number_style: digit, suffix: ".", allow_compound: true}
    Punkt: {number_style: digit, suffix: ")", allow_compound: true}
    Podpunkt: {number_style: letter_cyrillic, suffix: ")", allow_compound: false}
  decode_prefix_space_policy:
    default: required
    Paragraph: optional
  decode_number_styles:
    Razdel: roman_or_digit
    Glava: roman_or_digit
    Paragraph: digit
    Statya: digit
    Chast: digit
    Punkt: digit
    Podpunkt: digit
  closed_vocabularies:
    - id: decode_hierarchy_level
      rust_path: crates/ln-decode/src/domain.rs
      rust_enum: HierarchyLevel
      yaml_map: decode_level_aliases
      compare: variant_names_are_map_keys
    - id: force_status
      rust_path: crates/ln-temporal/src/domain.rs
      rust_enum: NormativeState
      yaml_list: force_status_values
      compare: as_str_tokens_are_list_items
    - id: industrial_ops
      rust_path: crates/ln-temporal/src/domain.rs
      rust_enum: CtvIndustrialOpKind
      yaml_list: industrial_op_kinds
      compare: as_str_tokens_are_list_items
    - id: membership_change
      rust_path: crates/ln-temporal/src/domain.rs
      rust_enum: MembershipChangeKind
      yaml_list: membership_change_kinds
      compare: as_str_tokens_are_list_items
    - id: clock_kinds
      rust_path: crates/ln-temporal/src/domain.rs
      rust_enum: ClockKind
      yaml_list: clock_kinds
      compare: as_str_tokens_are_list_items
  clock_kinds:
    - factual_event
    - proceeding
    - legal_act_effect
    - source_publication
    - system_observation
  calendar:
    clock: legal_act_effect
    epoch: "1800-01-01"
    min_year: 1800
    max_year: 2100
    unit: civil_day
    timezone: none
    leap: proleptic_gregorian
    non_claims:
      - civil-day ordinal is not a legal calendar and not CTV text
      - ISO-to-ordinal does not imply InForce or applicability
  corpus_roles:
    - C0_seed
    - C1_amending_act
    - C2_edition_oracle
    - C2hint_change_overview
    - C3_alien_work
  evidence_classes:
    - legislative
    - hypothesized_from_oracle_diff
    - editorial_hint
  amendment_event_facets:
    - structural
    - industrial
    - text
    - force
  cross_act_edge_kinds:
    - amends
    - implements
    - specifies
    - conflicts_with
    - cites
    - refers_to
  # G0 vocabulary (D216, review-25 §A.8 / ADR-0019 G0 note): refers_to is the
  # superset family over cites; binding semantics are design-only [proposed]
  # vocabulary — no Rust enum and no parser classification change is implied.
  reference_binding_vocabulary:
    statuses: [proposed, confirmed, rejected, superseded]
    semantics_modes:
      - identity_ambulatory
      - designation_literal
      - fixed_expression
      - as_of_specified_date
      - event_relative
      - unclassified
    non_claims:
      - "binding survives a Repealed target; cites never upgrades to authority; refers_to is not amends and carries no target force"
      - "design vocabulary only: no Rust types, no classification wiring, no TSG closure"
  corpus_role_signals:
    - {role: C2hint_change_overview, field: path, needle: obzor-izmenenii, rank: 10}
    - {role: C2hint_change_overview, field: title, needle: "Обзор изменений", rank: 10}
    - {role: C2_edition_oracle, field: path, needle: red-ot-, rank: 20}
    - {role: C2_edition_oracle, field: path, needle: edition-, rank: 20}
    - {role: C2_edition_oracle, field: title, needle: "ред. от", rank: 20}
    - {role: C1_amending_act, field: title, needle: "внести в", rank: 15}
    - {role: C1_amending_act, field: title, needle: "внесении изменений", rank: 15}
    - {role: C3_alien_work, field: path, needle: reshenie-fas, rank: 5}
    - {role: C3_alien_work, field: path, needle: postanovlenie-pravitelstva, rank: 5}
    - {role: C3_alien_work, field: path, needle: prikaz-, rank: 5}
    - {role: C3_alien_work, field: path, needle: opredelenie-, rank: 5}
  link_classifiers:
    - {kind: amends, context_needle: "внесении изменений", confidence: 0.9}
    - {kind: amends, context_needle: "внесении изменения", confidence: 0.9}
    - {kind: amends, context_needle: "внести изменения", confidence: 0.85}
    - {kind: amends, context_needle: "в ред.", confidence: 0.9}
    - {kind: amends, context_needle: "изменениями", confidence: 0.85}
    - {kind: amends, context_needle: "дополнен", confidence: 0.8}
    - {kind: amends, context_needle: "признать утратившим", confidence: 0.85}
    - {kind: cites, context_needle: "согласно", confidence: 0.6}
    - {kind: cites, context_needle: "в соответствии с", confidence: 0.6}
    - {kind: cites, context_needle: "предусмотренном", confidence: 0.55}
    - {kind: cites, context_needle: "на основании", confidence: 0.55}
    - {kind: implements, context_needle: "в порядке", confidence: 0.5}
    - {kind: implements, context_needle: "установленном", confidence: 0.5}
    - {kind: specifies, context_needle: "перечень", confidence: 0.4}
    - {kind: specifies, context_needle: "требования", confidence: 0.4}
  document_profiles:
    - {name: federal_law, path_needles: "federalnyi-zakon|law_", boost: "1.0"}
    - {name: government_act, path_needles: "postanovlenie-pravitelstva|rasporyazhenie-pravitelstva|resolution_|directive_", boost: "0.9"}
    - {name: departmental_act, path_needles: "prikaz-|order_|instruktsiya", boost: "0.85"}
    - {name: court_decision, path_needles: "postanovlenie-arbitrazhnogo|opredelenie|decision_", boost: "0.8"}
    - {name: code, path_needles: "kodeks", boost: "1.0"}
    - {name: default, path_needles: "", boost: "0.7"}
  classifier_templates:
    - {name: amends_v_red, kind: amends, confidence: "0.9", match: all, needles: "ФЗ", morph_needles: "в ред.|в редакции|редакции"}
    - {name: amends_changes, kind: amends, confidence: "0.85", match: any, needles: "изменениями|внесении изменений|внесении изменения|дополнен|признать утратившим"}
    - {name: cites_according, kind: cites, confidence: "0.7", match: any, needles: "в соответствии с|согласно|предусмотренном|на основании|руководствуясь|установленным законом|им законом|предусмотренным законом"}
    - {name: implements_order, kind: implements, confidence: "0.5", match: any, needles: "в порядке|установленном|во исполнение"}
    - {name: specifies_list, kind: specifies, confidence: "0.4", match: any, needles: "перечень|требования|классификаци"}

# Document structural profiles: system_observation heuristics (ADR-0020).
# Not legal classification, not an AST. Roles are a closed vocabulary;
# ladder tokens must resolve inside the decode-token catalog.
document_groups:
  non_claims:
    - "document group binding is a system_observation heuristic, not legal classification"
    - "parsed_as Work→DocumentGroupRef binding is a system_observation heuristic, never legal authority (R8-10)"
    - "the document_groups vocabulary stays in the YAML catalog; only the binding (group + catalog version) transfers to the graph"
    - "court practice (court_practice) is text-only: practice text is not an AST (ADR-0020)"
  structural_roles:
    - container
    - unit
    - subunit
    - subunit-text
    - text-only
  structural_only_tokens:
    - primechanie
    - prilozhenie
  groups:
    - id: federal_law@v1
      granularity: statya
      text_boundary: [unit, container]
      needles:
        - {field: path, needle: federalnyi-zakon, rank: 10}
        - {field: path, needle: law_, rank: 20}
        - {field: kind, needle: law, rank: 30}
        - {field: type, needle: federal, rank: 30}
      # R8-08: federal laws have no razdel (44-FZ: chapters only); razdel is
      # active only in the code ladder. A РАЗДЕЛ marker in a federal-law
      # document is an undeclared level and fails closed as a boundary.
      ladder:
        - {token: glava, role: container}
        - {token: paragraph, role: container}
        - {token: statya, role: unit}
        - {token: chast, role: subunit, suffix: ".", number_style: digit, compound: true}
        - {token: punkt, role: subunit, recursive: true, max_depth: 2, suffix: ")", number_style: digit, compound: true}
        - {token: podpunkt, role: subunit, suffix: ")", number_style: letter_cyrillic, compound: false}
    - id: code
      granularity: statya
      text_boundary: [unit, container]
      max_depth: 2
      needles:
        - {field: path, needle: kodeks, rank: 10}
        - {field: kind, needle: code, rank: 20}
      ladder:
        - {token: razdel, role: container}
        - {token: glava, role: container}
        - {token: statya, role: unit}
    - id: government_resolution
      granularity: punkt
      text_boundary: [unit, container]
      needles:
        - {field: path, needle: postanovlenie-pravitelstva, rank: 10}
        - {field: path, needle: rasporyazhenie-pravitelstva, rank: 10}
        # Bounded PP_60 ref anchor path needle (S02): Garant Cyrillic filenames
        # do not carry the latin postanovlenie-pravitelstva token, so detect on
        # `PP_60_27-01-2022.odt` stayed Unknown. The `pp_` marker (act-number
        # form) lets the same inspect anchor bind government_resolution while
        # inspect remains `kind=None`. Deliberately NOT the Cyrillic word
        # postanovlenie (false positives on court_practice / postanovlenie-plenuma
        # rank conflicts). Lower rank than the explicit latin needles so a real
        # postanovlenie-pravitelstva path still wins on the more specific token.
        - {field: path, needle: pp_, rank: 15}
        - {field: kind, needle: resolution, rank: 20}
      ladder:
        - {token: punkt, role: unit, recursive: true, max_depth: 3, suffix: ".", number_style: digit}
        - {token: podpunkt, role: subunit, suffix: ")", number_style: letter_cyrillic}
        - {token: prilozhenie, role: container, surface: "Приложение"}
    - id: departmental_order
      granularity: punkt
      text_boundary: [unit, container]
      needles:
        - {field: path, needle: prikaz-, rank: 10}
        - {field: path, needle: prikaz, rank: 20}
        - {field: kind, needle: order, rank: 20}
        - {field: type, needle: order, rank: 20}
      ladder:
        - {token: punkt, role: unit, recursive: true, max_depth: 4, suffix: ")", number_style: digit}
        - {token: podpunkt, role: subunit, suffix: ")", number_style: letter_cyrillic}
        - {token: primechanie, role: subunit-text, surface: "Примечание"}
        - {token: prilozhenie, role: container, surface: "Приложение"}
    - id: court_practice
      text_only: true
      needles:
        - {field: path, needle: reshenie-fas, rank: 10}
        - {field: path, needle: opredelenie-, rank: 10}
        - {field: path, needle: postanovlenie-plenuma, rank: 10}
        - {field: kind, needle: fas, rank: 20}
        - {field: kind, needle: court, rank: 20}
        - {field: kind, needle: decision, rank: 25}
        - {field: kind, needle: prescription, rank: 25}
        - {field: kind, needle: determination, rank: 25}
      ladder: []

# Separate from fsm (readiness). Governor compares contract.fsm_state to
# fsm.current only. Do not move readiness current for design inventory.
assembly_fsm:
  name: temporal-ast-assembly
  initial: S_ingest
  current: S_ready_bounded
  meaning: process model for XML to events to AST; not readiness O-state
  states:
    S_design:
      name: design_inventory
      meaning: Review 4 vocabulary named; no executable stack propose
    S_ingest:
      name: classify_bytes
      meaning: assign corpus_roles; reject unclassified
    S_decode:
      name: provider_blocks
      meaning: WordML or ODT to ParsedBlock; wrong family fail-closed
    S_extract:
      name: snapshot_candidates
      meaning: markers mentions phrases; not AST
    S_identify:
      name: work_expression
      meaning: mint identity; bad ISO fail-closed
    S_bind:
      name: marker_to_cc
      meaning: registry only; Unknown is legal
    S_propose:
      name: stack_attach_drafts
      meaning: document-order stack; not committed
    S_admit:
      name: conflict_quarantine
      meaning: two-parent / presence conflict / no provenance stop
    S_commit:
      name: append_events
      meaning: append-only with evidence_class
    S_fold:
      name: edition_ast_at
      meaning: fold membership then presence at ordinal t
    S_verify:
      name: replay_and_oracle_diff
      meaning: fold replay and EditionOracle checksum
    S_heal:
      name: new_event_or_waiver
      meaning: never edit the tree
    S_ready_bounded:
      name: bounded_fixture_ready
      meaning: one fixture replay-ok; not S6 and not Applicable
  non_claims:
    - assembly_fsm is not kb-ontology-readiness and not O3 exit
    - current S_ready_bounded: one fixture (402-FZ) passes full pipeline (drift=0, ctv_resolved>0, real expression_id); NOT TSG S6, NOT Applicable; assembly FSM complete

non_claims:
  - classifier P/R is one-catalog bounded evidence, not corpus-wide quality
  - ranked unknown-form census carries lexemes only, never raw legal text
  - YAML patch candidates are human-review suggestions, never auto-applied runtime mutations
  - YAML catalog is not production graph schema
  - FSM current state is inventory, not product readiness
  - Hierarchy lift is not legal fact and not CTV text
  - InForce does not imply Applicability
  - assembly_fsm and corpus_roles are design inventory, not store types
  - C2hint overview is not a legislative event log
