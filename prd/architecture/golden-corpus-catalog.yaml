# Golden corpus catalog: the 40 numbered cases of review-26 section 10
# (doc/review/review-26-23-08-2026.md), tracked as YAML-as-data (D222).
# Design-only: no case is executed here, no runtime type is minted from
# this file, and pin tests embed this file verbatim as data. Tier
# assignment per D273: G0 Shape / G1 Official / G2 Hostile / G3
# End-to-end. Lifecycle stays proposed; authority stays with the review
# and the temporal model (owner: review-26-section-10).

schema_version: law-nexus-golden-corpus-catalog/v1
lifecycle: "[proposed]"
authoritative: false
owner: review-26-section-10
related:
  - prd/temporal-legal-model.md
  - prd/architecture/model-crystal.md
boundary: >
  Design-only catalog of the forty cases numbered 1-40 in review-26
  section 10, grouped as assertion-bitemporal, pending-effects,
  structure-identity, source-cst, references and procurement, and
  tiered per D273 as G0 Shape (synthetic semantic forms), G1 Official
  (verified official Russian acts), G2 Hostile (conflicts,
  incompleteness, corrections, ambiguous identity) and G3 End-to-end
  (temporal QA and procurement case traces). Each case carries its
  review anchor, group, tier, design-only status, a character-faithful
  Russian summary transcribed from the review, and dependencies that
  name only existing P1-companion contract YAML. Pin tests embed this
  file as data (D222). Three G0 homonyms are distinct and must never
  be collapsed: the parser evidence-ladder G0 of
  prd/parser/representative_golden_corpus_acceptance_protocol.md, the
  disposition/ADR labels G0(a-g) of the P1 dispositions, and the
  corpus-tier G0 Shape of this catalog. This file is not case
  execution, not legal gold, not the S02-owned sibling nineteen-case
  series (no id from that series appears here), not a Rust enum, not
  OntologyCatalog input and not a closed_vocabularies row.
non_claims:
  - "No case execution: the catalog names and classifies the forty cases; it never runs them and never ships corpus fixtures."
  - "Not legal gold: summaries are character-faithful transcriptions of review-26 section 10 and carry no adjudicated legal truth."
  - "Not the S02-owned sibling nineteen-case series: ids of that series never appear in this catalog."
  - "No Rust enum, no serde types and no product code path is minted from or parses this file."
  - "Not OntologyCatalog input."
  - "Not a closed_vocabularies row and not a vocabulary token."
  - "No lifecycle promotion: the catalog stays proposed and non-authoritative."
  - "The parser evidence-ladder G0, the disposition G0(a-g) labels and the corpus-tier G0 Shape stay distinct and are never collapsed."
tiers:
  - G0
  - G1
  - G2
  - G3
groups:
  - assertion-bitemporal
  - pending-effects
  - structure-identity
  - source-cst
  - references
  - procurement
statuses:
