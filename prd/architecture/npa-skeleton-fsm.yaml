# NPA document skeleton FSM — design-only contract.
# This file is not a parser, resolver, runtime promotion gate, or legal-effect model.
# Форма следует prd/architecture/m205-s03-context-fsm.yaml и ADR-0029.
schema: law-nexus/npa-skeleton-fsm/v1
lifecycle: [proposed]
authoritative: false
owner_adr: '0028'
related_adrs: ['0013', '0016', '0017', '0029']
related_decisions: [D585, D586, D587]
related_constraints: [RC28-F06, RC28-F07]
human_adoption: pending
runtime_stop_active: true
consumes:
  - prd/architecture/kb-ontology.yaml            # document_groups: профили, ladder, granularity
  - prd/architecture/m205-s03-context-fsm.yaml   # фазы P0/P1/P2
  - prd/architecture/npa-table-fsm.yaml          # таблица как содержимое P2

non_claims:
  - design evidence only; no runtime promotion, resolver, identity minting, or legal conclusion
  - скелет описывает структуру и адресацию, не семантику норм
  - узлы скелета — Proposed-кандидаты; Work/ComponentId/CTV/InForce не минтится
  - counts уровней не являются доказательством полноты документа (INV-22)
  - привязка document_groups остаётся system_observation эвристикой (R8-10), не юридической классификацией
  - punkt-идентичности не адмитятся (адмитятся только glava-1, statya-4, statya-5)
  - «раздел», «глава», «статья», «часть», «пункт», «подпункт» — структурные метки, не правовая квалификация

# ---------------------------------------------------------------------------
# FSM скелета. Соответствует фазам P0_decode -> P1_base_context -> P2_local_analysis
# из semantic_process_fsm (m205-s03-context-fsm.yaml); ниже P2 не выходит.
# ---------------------------------------------------------------------------
skeleton_fsm:
  id: npa-skeleton.document_skeleton
  initial: SourceDecoded
  states:
    - SourceDecoded          # P0: декодер отдал абзацы с диагностиками
    - ProfileBound           # профиль document_groups выбран и зафиксирован
    - FrontmatterScanning    # сканирование шапки до первого структурного маркера
    - HeaderAssembled        # шапка собрана (реквизиты как структура)
    - HierarchyDeclared      # объявлен профиль иерархии (levels_used/absent)
    - LevelDetecting         # определение уровня единицы (маркеры + стилевые сигналы)
    - AppendixBoundarySeen   # граница акт/приложение
    - NestingResolving       # родительство по порядку уровней профиля
    - AnchorAttaching        # привязка адреса (класс выгрузки)
    - AstProjecting          # текст абзаца -> content-запись узла
    - Resolving              # разрешение гипотез в конце документа
    - SkeletonResolved       # терминал: скелет построен
    - SkeletonPartial        # терминал: часть узлов осталась без уровня
    - SkeletonHold           # терминал: fail-closed, структура не распознана
    - SkeletonStopped        # терминал: drift/undefined policy
  transitions:
    - {from: SourceDecoded, event: docs_with_diagnostics, to: ProfileBound}
    - {from: SourceDecoded, event: decode_failed, to: SkeletonStopped}
    - {from: ProfileBound, event: profile_evidenced, to: FrontmatterScanning}
    - {from: ProfileBound, event: profile_unresolved, to: SkeletonHold}
    - {from: FrontmatterScanning, event: first_structural_marker, to: HeaderAssembled}
    - {from: FrontmatterScanning, event: document_end, to: SkeletonHold}
    - {from: HeaderAssembled, event: hierarchy_counted, to: HierarchyDeclared}
    - {from: HierarchyDeclared, event: marker_matched, to: LevelDetecting}
    - {from: HierarchyDeclared, event: no_marker_found, to: SkeletonPartial}
    - {from: LevelDetecting, event: level_in_profile, to: NestingResolving}
    - {from: LevelDetecting, event: level_not_in_profile, to: AppendixBoundarySeen}
    - {from: LevelDetecting, event: style_signal_conflict, to: SkeletonHold}
    - {from: AppendixBoundarySeen, event: annex_root_recognized, to: NestingResolving}
    - {from: AppendixBoundarySeen, event: boundary_ambiguous, to: SkeletonHold}
    - {from: NestingResolving, event: parent_found, to: AnchorAttaching}
    - {from: NestingResolving, event: no_higher_level_open, to: SkeletonHold}
    - {from: AnchorAttaching, event: anchor_bound, to: AstProjecting}
    - {from: AnchorAttaching, event: anchor_scheme_partial, to: AstProjecting}
    - {from: AnchorAttaching, event: anchor_scheme_absent, to: AstProjecting}
    - {from: AstProjecting, event: text_projected, to: LevelDetecting}
    - {from: AstProjecting, event: document_end, to: Resolving}
    - {from: Resolving, event: all_nodes_leveled, to: SkeletonResolved}
    - {from: Resolving, event: unleveled_nodes_remain, to: SkeletonPartial}
    - {from: [ProfileBound, FrontmatterScanning, HeaderAssembled, HierarchyDeclared, LevelDetecting, AppendixBoundarySeen, NestingResolving, AnchorAttaching, AstProjecting], event: policy_or_threshold_drift, to: SkeletonStopped}
  terminal: [SkeletonResolved, SkeletonPartial, SkeletonHold, SkeletonStopped]
  resolved_requires:
    - hierarchy_declared_in_header
    - every_node_has_level_from_profile_or_marked_unleveled
    - parent_is_strictly_higher_level
    - anchor_scheme_recorded
    - no_semantic_field_on_any_node

  immutability_invariants:
    - source_paragraphs_are_immutable
    - skeleton_is_derived_not_authoritative
    - level_order_comes_from_profile_not_code       # порядок уровней берётся из document_groups ladder
    - undeclared_level_is_boundary_fail_closed      # razdel в federal_law -> граница, не узел (R8-08)
    - punkt_contracts_stay_separate                 # punkt-fz (subunit, «)») != punkt-res (unit, «.») != punkt-ord (unit, «)»)
    - anchor_scheme_follows_export_class            # нативный: разрежённые закладки; shell-less: закладка на абзац
    - node_text_is_full_not_truncated               # текст единицы идёт в AST целиком, не в обрезанный title
    - title_is_a_view_not_the_content               # title — представление, не источник текста
    - no_semantics_in_skeleton                      # семья/класс доказательства — слой L4
    - no_identity_minting                           # WorkId/ComponentId/CTV не создаются
    - unleveled_node_is_marked_not_guessed          # нераспознанный уровень -> marked unleveled, не догадка
    - appendix_is_first_class_root                  # приложение — корневой узел, не «ещё один пункт»

  # -------------------------------------------------------------------------
  # МЕТА: правила как данные.
  # -------------------------------------------------------------------------
  lexicon:
    level_markers:
      # порядок от верхнего уровня к нижнему (внутри профиля)
      - {level: razdel, pattern: '^Раздел\s+([IVXLC\d]+)[.\s]', token: razdel}
      - {level: glava, pattern: '^Глава\s+(\d+)[.\s]', token: glava}
      - {level: paragraph, pattern: '^§\s*(\d+)|^Параграф\s+(\d+)', token: paragraph}
      - {level: statya, pattern: '^Статья\s+([\d.]+)\.?\s*(.*)$', token: statya}
      - {level: chast, pattern: '^(\d+(?:\.\d+)*)\.\s', token: chast}
      - {level: punkt, pattern: '^(\d+(?:\.\d+)*)\)\s', token: punkt}
      - {level: podpunkt, pattern: '^([а-яё])\)\s', token: podpunkt}
      - {level: prilozhenie, pattern: '^Приложение\s*(?:N\s*)?([\d\w]*)', token: prilozhenie}
    style_signals:
      # вспомогательные сигналы уровня; НЕ заменяют маркер
      - {signal: pstyle_title, source: 'w:pStyle=2', supports: [glava, statya], note: 'отделяет верх от низа'}
      - {signal: outline_lvl, source: 'w:outlineLvl', supports: [glava], note: 'чист только для глав; для статей шумит'}
      - {signal: jc_center, source: 'w:jc=center', supports: [glava], note: 'в 44-ФЗ только главы'}
      - {signal: bookmark_density, source: 'aml:annotation w:name=P*', supports: [], note: 'определяет класс выгрузки и схему якоря'}
    export_classes:
      - {class: native, evidence: 'offline-ссылки преобладают; закладок <0.3 на абзац',
         anchor_scheme: range_by_paragraph_order,
         note: 'dst цели не равен закладке (D586)'}
      - {class: shell_less, evidence: 'internal-ссылки; закладок >=0.9 на абзац',
         anchor_scheme: direct_bookmark,
         note: 'dst цели равен закладке (D586)'}
    appendix_markers:
      - {marker: 'Утвержден', level: annex_root}
      - {marker: 'ПРИЛОЖЕНИЕ', level: annex_root}
      - {marker: 'Приложение N', level: annex_root}
    thresholds_as_parameters:
      frontmatter_max_paras: 40
      anchor_density_shell_less: 0.9
      anchor_density_native_max: 0.3

  # -------------------------------------------------------------------------
  # Инвариантный аудит (корпусный гейт).
  # -------------------------------------------------------------------------
  invariant_audit_rules:
    - id: S1_parent_order
      rule: parent_level_index < node_level_index для каждого узла
    - id: S2_single_root
      rule: ровно один корневой узел документа
    - id: S3_levels_declared
      rule: каждый использованный уровень присутствует в hierarchy.levels_used шапки
    - id: S4_no_declared_absent_level
      rule: уровень из levels_absent не встречается среди узлов
    - id: S5_anchor_scheme_recorded
      rule: у документа записан anchor_scheme и он согласован с классом выгрузки
    - id: S6_text_completeness
      rule: сумма символов content-записей == сумма символов абзацев вне таблиц
    - id: S7_no_semantic_field
      rule: ни один узел не несёт семью/класс доказательства/юридическую оценку
    - id: S8_annex_is_root
      rule: каждый prilozhenie-узел имеет parent == root документа

# ---------------------------------------------------------------------------
# Разделение слоёв (D587). Скелет не смешивается с прочими слоями.
# ---------------------------------------------------------------------------
layer_boundary:
  this_layer: L1_skeleton
  emits: [document, node, content, table]
  does_not_emit: [nav_edge, operation, semantic_candidate]
  next_layers:
    - {layer: L2_links, owner: 'D586', consumes: [node, content]}
    - {layer: L3_operations, owner: 'F13', consumes: [node, content]}
    - {layer: L4_semantics, owner: 'M210', consumes: [node]}

# ---------------------------------------------------------------------------
# Опциональная стадия промпта для fail-closed остатка (ADR-0029 §10).
# ---------------------------------------------------------------------------
prompt_residue_stage:
  enabled: false
  trigger_state: SkeletonHold
  prompt_composition:
    - ровно один отсутствующий слот (например, уровень абзаца или граница приложения)
    - контекст: до 5 абзацев вокруг позиции и профиль иерархии
    - allowed_labels: closed-словарь уровней из lexicon.level_markers
  acceptance:
    - метка принимается только после invariant_audit_rules S1..S8
    - принятая метка несёт provenance: llm
    - отказ возвращает состояние в SkeletonHold
  forbidden:
    - свободная экстракция текста
    - генерация уровней вне профиля документа
    - семантические метки (семья, класс доказательства)
