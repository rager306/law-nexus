honesty_fragments:
  - a cardinality match is not a member match

force_set_control:
  runtime_source: prd/architecture/kb-ontology.yaml#vocabulary.force_status_values
  living_canon_source: prd/architecture/force-interval-set-contract.yaml#written_statuses
  runtime_members:
    - in_force
    - not_yet_in_force
    - suspended
    - repealed
    - expired
    - invalidated
  living_written_members:
    - InForce
    - NotYetInForce
    - Suspended
    - Repealed
    - Expired
    - Invalidated
  rule: >
    Compare members, never list length. A cardinality match is not a member
    match. M188 alignment landed: runtime force_status_values is the
    snake_case of the living written_statuses (ADR-0018 G0(c) / P0-5a), so
    the member-compare observes a match; the fragment stays in
    honesty_fragments above as the unconditional governor contract and is no
    longer required on the data surfaces. Unknown remains a point-query
    outcome, not a written interval status. Superseded is a VersionRelation.
    Transitional moved to ADR-0021. Not interval algebra.

shacl_sparql_verdict: anti-runtime
shacl_sparql_rule: >
  SHACL/SPARQL/RDF must not become the product ontology control plane.
  Archive-only ACP/git-lex prior art (R066). D046 L6 compatibility
  projection only, after WALK-I and force-set alignment, never as fold
  or checkout runtime.

