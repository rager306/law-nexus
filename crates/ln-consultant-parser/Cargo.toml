[package]
name = "ln-consultant-parser"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
ln-decode = { path = "../ln-decode" }
ln-kb-ontology = { path = "../ln-kb-ontology" }
ln-temporal = { path = "../ln-temporal" }
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[[bin]]
name = "m209-amendment-provenance"
path = "src/bin/m209-amendment-provenance.rs"

[[bin]]
name = "npa-contour-diagnostics"
path = "src/bin/npa-contour-diagnostics.rs"

[[bin]]
name = "npa-gold-ladder"
path = "src/bin/npa-gold-ladder.rs"

[[bin]]
name = "npa-corpus-sample"
path = "src/bin/npa-corpus-sample.rs"

[[bin]]
name = "npa-corpus-acceptance"
path = "src/bin/npa-corpus-acceptance.rs"

[[bin]]
name = "npa-corpus-acceptance-v2"
path = "src/bin/npa-corpus-acceptance-v2.rs"

[[bin]]
name = "npa-promotion-eval"
path = "src/bin/npa-promotion-eval.rs"

[dev-dependencies]
