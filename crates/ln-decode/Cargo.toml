[package]
name = "ln-decode"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
quick-xml = "0.36"
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[[bin]]
name = "cleaned-project"
path = "src/bin/cleaned-project.rs"

[[bin]]
name = "npa-corpus-sweep"
path = "src/bin/npa-corpus-sweep.rs"

[[bin]]
name = "npa-bounds-scan"
path = "src/bin/npa-bounds-scan.rs"

[[bin]]
name = "npa-context-baseline"
path = "src/bin/npa-context-baseline.rs"

[[bin]]
name = "hierarchy-candidate-artifact"
path = "src/bin/hierarchy-candidate-artifact.rs"

[[bin]]
name = "npa-hybrid-records"
path = "src/bin/npa-hybrid-records.rs"

[[bin]]
name = "npa-integration-runner"
path = "src/bin/npa-integration-runner.rs"

[[bin]]
name = "corpus-inventory"
path = "src/bin/corpus-inventory.rs"

[[bin]]
name = "reader-nav"
path = "src/bin/reader-nav.rs"

