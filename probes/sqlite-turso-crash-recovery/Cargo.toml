# Bounded SQLite-vs-Turso crash/recovery evidence probe.
# This package is intentionally isolated from the law-nexus root workspace.
[package]
name = "sqlite-turso-crash-recovery"
version = "0.0.0"
edition = "2021"
publish = false
autotests = false

[[bin]]
name = "sqlite-turso-crash-recovery"
path = "src/main.rs"

[[test]]
name = "contracts"
path = "tests/contracts.rs"

[dependencies]
anyhow = "=1.0.100"
rusqlite = { version = "=0.39.0", default-features = false, features = ["bundled"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
tokio = { version = "=1.48.0", default-features = false, features = ["rt", "macros", "time"] }
turso = { version = "=0.7.1", default-features = false }

[workspace]

[profile.release]
debug = false
lto = false
