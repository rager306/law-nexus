# Repository quality checks for the Rust product runtime and Python harness.
#
# Commit profile:
# - lint/format only staged active Python files so new changes cannot add debt;
# - exclude python_archive/ from active Python lint/format;
# - always verify architecture claims and ADR references;
# - Cargo checks run only when staged Cargo/Rust paths change.
#
# Python product code is archived prior art under python_archive/product/.
# Active Python is the repository-control harness only (ADR-0007).
#
# Install exactly (forced overwrite prevents legacy hook chaining):
#   uv run pre-commit install --install-hooks --overwrite
# Run all configured hooks:
#   uv run pre-commit run --all-files

repos:
  - repo: local
    hooks:
      - id: ruff-check-python
        name: ruff check staged Python files
        entry: uv run ruff check
        language: system
        types: [python]
        exclude: ^python_archive/

      - id: ruff-format-python
        name: ruff format --check staged Python files
        entry: uv run ruff format --check
        language: system
        types: [python]
        exclude: ^python_archive/

      - id: cargo-fmt-rust
        name: Rust workspace formatting
        entry: cargo fmt --all -- --check
        language: system
        pass_filenames: false
        files: ^(Cargo\.(toml|lock)|crates/.*\.(rs|toml))$

      - id: cargo-check-rust
        name: Rust workspace offline check
        entry: cargo check --workspace --offline
        language: system
        pass_filenames: false
        files: ^(Cargo\.(toml|lock)|crates/.*\.(rs|toml))$

      - id: cargo-clippy-rust
        name: Rust workspace clippy
        entry: cargo clippy --workspace --offline --all-targets -- -D warnings
        language: system
        pass_filenames: false
        files: ^(Cargo\.(toml|lock)|crates/.*\.(rs|toml))$

      - id: crate-dependency-allowlist
        name: workspace crate dependency allowlist
        entry: uv run python scripts/verify-crate-dependency-allowlist.py
        language: system
        pass_filenames: false
        files: ^(Cargo\.(toml|lock)|crates/.*\.(rs|toml)|prd/architecture/crate-dependency-allowlist\.json)$

      - id: architecture-claim-conformance
        name: architecture lifecycle tags and ADR references
        entry: uv run python scripts/verify-adr-conformance.py
        language: system
        pass_filenames: false
        always_run: true
