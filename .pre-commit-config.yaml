# Repository quality checks during the Python-reference phase.
#
# Commit profile:
# - lint/format only staged Python files so new changes cannot add debt;
# - always enforce current Python onion dependencies while it remains the
#   behavioral reference;
# - always verify architecture claims and ADR references.
#
# Existing full-tree Ruff debt is tracked separately and must not be hidden.
# The future ADR-0007 repository harness will add Cargo and document-freshness
# profiles while preserving these checks until the final Rust cutover.
#
# Install exactly (forced overwrite prevents legacy hook chaining):
#   uv run pre-commit install --install-hooks --overwrite
# Run all configured hooks:
#   uv run pre-commit run --all-files

repos:
  - repo: local
    hooks:
      - id: ruff-check-python
        name: ruff check staged Python files
        entry: uv run ruff check
        language: system
        types: [python]

      - id: ruff-format-python
        name: ruff format --check staged Python files
        entry: uv run ruff format --check
        language: system
        types: [python]

      - id: python-onion-dependencies
        name: Python reference onion dependency contracts
        entry: uv run lint-imports
        language: system
        pass_filenames: false
        always_run: true

      - id: architecture-claim-conformance
        name: architecture lifecycle tags and ADR references
        entry: uv run python scripts/verify-adr-conformance.py
        language: system
        pass_filenames: false
        always_run: true
